name: CI Kubernetes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_kind_smoke:
        description: "Run kind cluster smoke (heavy)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: ci-k8s-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned offline validator (no Kubernetes API required).
  KUBECONFORM_VERSION: "v0.6.7"
  # Schema target close to kindest/node v1.33.1 from stage 3A.
  KUBECONFORM_K8S_VERSION: "1.33.0"
  API_IMAGE: credit-scoring-api:stage3a
  MODELS_IMAGE: credit-scoring-models:stage3a

jobs:
  manifests:
    name: Manifest validation (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: "v1.34.1"

      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kubeconform.tgz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tgz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Render Kustomize overlay
        run: |
          mkdir -p artifacts/ci
          kubectl kustomize k8s/overlays/local | tee artifacts/ci/kustomize-local.yaml

      - name: Offline schema validation (kubeconform)
        run: |
          set -euo pipefail
          # Offline schema validation only (no cluster / OpenAPI discovery).
          # Keep validation enabled; do not disable schema checks.
          kubeconform \
            -kubernetes-version "${KUBECONFORM_K8S_VERSION}" \
            -summary \
            -strict \
            -output json \
            artifacts/ci/kustomize-local.yaml \
            > artifacts/ci/kubeconform-local.json
          kubeconform \
            -kubernetes-version "${KUBECONFORM_K8S_VERSION}" \
            -summary \
            -strict \
            artifacts/ci/kustomize-local.yaml

      - name: Upload rendered manifests + report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kustomize-kubeconform
          path: |
            artifacts/ci/kustomize-local.yaml
            artifacts/ci/kubeconform-local.json
          if-no-files-found: warn

  kind-smoke:
    name: kind smoke (optional)
    if: github.event_name == 'workflow_dispatch' && inputs.run_kind_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Disk report (before cleanup)
        run: bash scripts/ci/disk_report.sh before-cleanup

      - name: Free disk on GitHub-hosted runner
        run: bash scripts/ci/free_runner_disk.sh

      - name: Disk report (after cleanup)
        run: bash scripts/ci/disk_report.sh after-cleanup

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Python deps (CPU torch only; no API stack)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # Synthetic artifacts need project + torch/onnx; avoid pulling CUDA wheels.
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "onnx>=1.16" "onnxruntime>=1.18" "onnxscript>=0.1.0"
          pip cache purge || true

      - name: Generate synthetic artifacts
        run: python scripts/ci/generate_synthetic_artifacts.py --output-dir models --force

      - name: Setup kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: "v1.34.1"

      - name: Install kind
        run: |
          curl -fsSL -o ./kind https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      # Build images BEFORE creating kind so the kindest/node image is not
      # competing with build cache for the same free space window.
      - name: Build API and models images
        run: |
          set -euo pipefail
          docker build -f docker/Dockerfile.api -t "${API_IMAGE}" .
          docker build -f docker/Dockerfile.models -t "${MODELS_IMAGE}" .
          bash scripts/ci/disk_report.sh after-docker-build

      - name: Prune build cache (keep tagged images)
        run: |
          set -euo pipefail
          docker builder prune -af || true
          # Remove dangling layers only; keep credit-scoring-*:stage3a.
          docker image prune -f || true
          bash scripts/ci/disk_report.sh after-docker-prune

      - name: Create kind cluster
        run: kind create cluster --config k8s/kind/cluster.yaml --wait 120s

      - name: Disk report (before kind load)
        run: bash scripts/ci/disk_report.sh before-kind-load

      - name: Load images into kind
        run: |
          set -euo pipefail
          # Load one image at a time; kind materializes a tar into containerd.
          kind load docker-image "${API_IMAGE}" --name credit-scoring
          bash scripts/ci/disk_report.sh after-kind-load-api
          kind load docker-image "${MODELS_IMAGE}" --name credit-scoring
          bash scripts/ci/disk_report.sh after-kind-load-models

      - name: Deploy overlay (real kubectl apply after cluster exists)
        run: |
          set -euo pipefail
          kubectl apply -k k8s/overlays/local
          kubectl -n credit-scoring rollout status deployment/credit-scoring-api --timeout=180s
          kubectl -n credit-scoring get pods -o wide
          kubectl -n credit-scoring wait --for=condition=ready pod -l app.kubernetes.io/name=credit-scoring-api --timeout=120s

      - name: Smoke via port-forward
        run: |
          set -euo pipefail
          kubectl -n credit-scoring port-forward svc/credit-scoring-api 8000:8000 &
          PF_PID=$!
          cleanup() { kill "${PF_PID}" 2>/dev/null || true; }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/live >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          echo "== /health/live =="
          curl -fsS http://127.0.0.1:8000/health/live
          echo
          echo "== /health/ready =="
          curl -fsS http://127.0.0.1:8000/health/ready
          echo
          echo "== /predict =="
          curl -fsS -X POST http://127.0.0.1:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{
              "LIMIT_BAL": 20000, "SEX": 2, "EDUCATION": 2, "MARRIAGE": 1, "AGE": 24,
              "PAY_0": 2, "PAY_2": 2, "PAY_3": -1, "PAY_4": -1, "PAY_5": -2, "PAY_6": -2,
              "BILL_AMT1": 3913, "BILL_AMT2": 3102, "BILL_AMT3": 689,
              "BILL_AMT4": 0, "BILL_AMT5": 0, "BILL_AMT6": 0,
              "PAY_AMT1": 0, "PAY_AMT2": 689, "PAY_AMT3": 0, "PAY_AMT4": 0, "PAY_AMT5": 0, "PAY_AMT6": 0
            }'
          echo
          echo "== /metrics =="
          curl -fsS http://127.0.0.1:8000/metrics | head -n 40
          echo
          echo "OK: kind smoke endpoints passed"

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name credit-scoring
