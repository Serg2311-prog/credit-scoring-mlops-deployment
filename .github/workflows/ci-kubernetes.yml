name: CI Kubernetes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_kind_smoke:
        description: "Run kind cluster smoke (heavy)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: ci-k8s-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    name: Manifest validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.34.1"
      - name: Render local overlay
        run: kubectl kustomize k8s/overlays/local | tee /tmp/rendered.yaml
      - name: Client dry-run apply
        run: kubectl apply --dry-run=client -f /tmp/rendered.yaml

  kind-smoke:
    name: kind smoke (optional)
    if: github.event_name == 'workflow_dispatch' && inputs.run_kind_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-api.txt -r requirements-nn.txt

      - name: Generate synthetic artifacts
        run: python scripts/ci/generate_synthetic_artifacts.py --output-dir models --force

      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.34.1"

      - name: Install kind
        run: |
          curl -fsSL -o ./kind https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Create kind cluster
        run: kind create cluster --config k8s/kind/cluster.yaml --wait 120s

      - name: Build and load images
        run: |
          docker build -f docker/Dockerfile.api -t credit-scoring-api:stage3a .
          docker build -f docker/Dockerfile.models -t credit-scoring-models:stage3a .
          kind load docker-image credit-scoring-api:stage3a --name credit-scoring
          kind load docker-image credit-scoring-models:stage3a --name credit-scoring

      - name: Deploy overlay
        run: |
          kubectl apply -k k8s/overlays/local
          kubectl -n credit-scoring rollout status deployment/credit-scoring-api --timeout=180s

      - name: Smoke via port-forward
        run: |
          kubectl -n credit-scoring port-forward svc/credit-scoring-api 8000:8000 &
          PF_PID=$!
          sleep 5
          curl -fsS http://127.0.0.1:8000/health/live
          curl -fsS http://127.0.0.1:8000/health/ready
          kill $PF_PID || true

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name credit-scoring
