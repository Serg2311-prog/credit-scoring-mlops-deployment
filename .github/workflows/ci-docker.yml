name: CI Docker

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build-scan:
    name: Build images + Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      API_IMAGE: credit-scoring-api:ci
      MODELS_IMAGE: credit-scoring-models:ci
      FRONTEND_IMAGE: credit-scoring-frontend:ci
      DVC_IMAGE: credit-scoring-dvc-data:ci
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-nn.txt
            requirements-api.txt

      - name: Install deps for synthetic artifacts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-api.txt -r requirements-nn.txt

      - name: Generate synthetic model files for models image
        run: python scripts/ci/generate_synthetic_artifacts.py --output-dir models --force

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t "$API_IMAGE" .

      - name: Build models image
        run: docker build -f docker/Dockerfile.models -t "$MODELS_IMAGE" .

      - name: Build frontend image
        run: docker build -f docker/Dockerfile.frontend -t "$FRONTEND_IMAGE" .

      - name: Build DVC data image
        run: docker build -f docker/Dockerfile.dvcdata -t "$DVC_IMAGE" .

      - name: Prepare report directory
        run: mkdir -p artifacts/ci

      # Pin Trivy action to full commit SHA (v0.36.0); floating 0.28.x tag is invalid.
      - name: Trivy scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: credit-scoring-api:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Trivy JSON report (API)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: credit-scoring-api:ci
          format: json
          output: artifacts/ci/trivy-api.json
          exit-code: "0"
          severity: CRITICAL,HIGH,MEDIUM

      - name: Trivy scan models image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: credit-scoring-models:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Trivy JSON report (models)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: credit-scoring-models:ci
          format: json
          output: artifacts/ci/trivy-models.json
          exit-code: "0"
          severity: CRITICAL,HIGH,MEDIUM

      - name: Trivy scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: credit-scoring-frontend:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Trivy JSON report (frontend)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: credit-scoring-frontend:ci
          format: json
          output: artifacts/ci/trivy-frontend.json
          exit-code: "0"
          severity: CRITICAL,HIGH,MEDIUM

      - name: Trivy scan DVC data image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: credit-scoring-dvc-data:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-reports
          path: artifacts/ci/trivy-*.json
          if-no-files-found: warn
