name: CI Docker

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-build-scan:
    name: Build images + Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      API_IMAGE: credit-scoring-api:ci
      MODELS_IMAGE: credit-scoring-models:ci
      FRONTEND_IMAGE: credit-scoring-frontend:ci
      DVC_IMAGE: credit-scoring-dvc-data:ci
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Hosted runners ship large unused toolchains. Free space before heavy
      # Docker/Trivy work. Do not delete Docker engine itself.
      - name: Free runner disk (preinstalled unused tools)
        run: |
          set -euo pipefail
          echo "::group::disk before prune"
          df -h
          df -i
          docker system df || true
          echo "::endgroup::"
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /usr/local/lib/node_modules || true
          # Drop unused images/cache left by the image; keep docker usable.
          docker image prune -af || true
          docker builder prune -af || true
          echo "::group::disk after prune"
          df -h
          df -i
          docker system df || true
          echo "::endgroup::"

      # Pip cache intentionally omitted: synthetic artifacts are small, but
      # cached deps include torch-sized trees. Post-job cache save failed with
      # ENOSPC on run 45843958855 after an otherwise green Trivy gate.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install deps for synthetic artifacts
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt -r requirements-api.txt -r requirements-nn.txt

      - name: Generate synthetic model files for models image
        run: python scripts/ci/generate_synthetic_artifacts.py --output-dir models --force

      - name: Disk diagnostic (before Docker builds)
        run: |
          df -h
          df -i
          docker system df || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t "$API_IMAGE" .

      - name: Build models image
        run: docker build -f docker/Dockerfile.models -t "$MODELS_IMAGE" .

      - name: Build frontend image
        run: docker build -f docker/Dockerfile.frontend -t "$FRONTEND_IMAGE" .

      - name: Build DVC data image
        run: docker build -f docker/Dockerfile.dvcdata -t "$DVC_IMAGE" .

      - name: Disk diagnostic (after Docker builds)
        run: |
          df -h
          df -i
          docker system df || true

      - name: Prepare report directory
        run: mkdir -p artifacts/ci

      # Pin Trivy action to full commit SHA (v0.36.0); floating 0.28.x tag is invalid.
      # Each security scan runs independently (if: always) so one failure cannot skip others.
      # Final gate below fails the job when any CRITICAL/HIGH (fixed) finding remains.
      - name: Trivy scan API image
        id: trivy_api
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: credit-scoring-api:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library

      - name: Trivy JSON report (API)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: credit-scoring-api:ci
          format: json
          output: artifacts/ci/trivy-api.json
          exit-code: "0"
          severity: CRITICAL,HIGH,MEDIUM
          vuln-type: os,library

      - name: Trivy scan models image
        id: trivy_models
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: credit-scoring-models:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library

      - name: Trivy JSON report (models)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: credit-scoring-models:ci
          format: json
          output: artifacts/ci/trivy-models.json
          exit-code: "0"
          severity: CRITICAL,HIGH,MEDIUM
          vuln-type: os,library

      - name: Trivy scan frontend image
        id: trivy_frontend
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: credit-scoring-frontend:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library

      - name: Trivy JSON report (frontend)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: credit-scoring-frontend:ci
          format: json
          output: artifacts/ci/trivy-frontend.json
          exit-code: "0"
          severity: CRITICAL,HIGH,MEDIUM
          vuln-type: os,library

      - name: Trivy scan DVC data image
        id: trivy_dvc
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: credit-scoring-dvc-data:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library

      - name: Trivy JSON report (DVC)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: credit-scoring-dvc-data:ci
          format: json
          output: artifacts/ci/trivy-dvc.json
          exit-code: "0"
          severity: CRITICAL,HIGH,MEDIUM
          vuln-type: os,library

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-reports
          path: artifacts/ci/trivy-*.json
          if-no-files-found: warn

      - name: Security gate (fail on any CRITICAL/HIGH)
        id: security_gate
        if: always()
        run: |
          set -euo pipefail
          failed=0
          for name in api models frontend dvc; do
            case "$name" in
              api) outcome="${{ steps.trivy_api.outcome }}" ;;
              models) outcome="${{ steps.trivy_models.outcome }}" ;;
              frontend) outcome="${{ steps.trivy_frontend.outcome }}" ;;
              dvc) outcome="${{ steps.trivy_dvc.outcome }}" ;;
            esac
            echo "Trivy $name outcome=$outcome"
            if [ "$outcome" != "success" ] && [ "$outcome" != "skipped" ]; then
              echo "::error::Security gate failed for $name image (outcome=$outcome)"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more Trivy CRITICAL/HIGH gates failed."
            exit 1
          fi
          echo "All Trivy security gates passed."

      # Free Docker layers/build cache after scans + gate so post-job steps
      # (and any residual tooling) are less likely to hit ENOSPC.
      # continue-on-error: cleanup must not fail a green gate, and must not
      # erase an earlier security-gate FAILURE (GHA keeps prior failed steps).
      - name: Free Docker disk after security gate
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "::group::disk before post-scan cleanup"
          df -h || true
          df -i || true
          docker system df || true
          echo "::endgroup::"
          docker builder prune -af || true
          docker buildx prune -af || true
          docker image rm -f "$API_IMAGE" "$MODELS_IMAGE" "$FRONTEND_IMAGE" "$DVC_IMAGE" || true
          docker image prune -af || true
          docker system prune -af --volumes || true
          echo "::group::disk after post-scan cleanup"
          df -h || true
          df -i || true
          docker system df || true
          echo "::endgroup::"
