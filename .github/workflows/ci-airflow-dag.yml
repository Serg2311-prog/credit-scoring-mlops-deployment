name: CI Airflow DAG

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-airflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dag-parse:
    name: Airflow DAG import (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow_home
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:///${{ github.workspace }}/.airflow_home/airflow.db
      CREDIT_SCORING_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Airflow + project deps
        run: |
          python -m pip install --upgrade pip
          pip install "apache-airflow==2.9.3" --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.9.3/constraints-3.12.txt"
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Init Airflow DB
        run: |
          mkdir -p "$AIRFLOW_HOME"
          airflow db migrate

      - name: Parse / import DAG
        run: |
          python -c "import airflow; print(airflow.__version__)"
          pytest -q tests/retraining/test_dag_structure.py::test_dag_import_airflow_optional --tb=short
          airflow dags list | tee artifacts_dag_list.txt || true
          # Explicit import path used by scheduler
          AIRFLOW__CORE__DAGS_FOLDER="${{ github.workspace }}/airflow_home/dags" \
            airflow dags list | grep credit_scoring_retraining
