name: CI Infrastructure

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-infra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBECONFORM_VERSION: "v0.6.7"
  KUBECONFORM_K8S_VERSION: "1.33.0"

jobs:
  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_VAR_cloud_id: "ci00000000000000000000"
      TF_VAR_folder_id: "ci00000000000000000000"
      TF_VAR_artifacts_bucket_name: "ci-credit-scoring-artifacts-validate"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false

      - name: Format check
        run: terraform -chdir=infra/terraform fmt -recursive -check

      - name: Init + validate staging
        run: |
          terraform -chdir=infra/terraform/environments/staging init -backend=false -input=false
          terraform -chdir=infra/terraform/environments/staging validate

      - name: Init + validate production
        run: |
          terraform -chdir=infra/terraform/environments/production init -backend=false -input=false
          terraform -chdir=infra/terraform/environments/production validate

      - name: Native terraform test (kubernetes module, mock_provider)
        run: |
          terraform -chdir=infra/terraform/modules/kubernetes init -backend=false -input=false
          terraform -chdir=infra/terraform/modules/kubernetes test

  kubernetes-manifests:
    name: Kustomize + kubeconform + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Setup kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: "v1.34.1"

      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kubeconform.tgz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tgz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Kustomize render (local + staging + production)
        run: |
          mkdir -p artifacts/ci
          kubectl kustomize k8s/overlays/local | tee artifacts/ci/kustomize-local.yaml
          kubectl kustomize k8s/overlays/staging | tee artifacts/ci/kustomize-staging.yaml
          kubectl kustomize k8s/overlays/production | tee artifacts/ci/kustomize-production.yaml

      - name: Offline schema validation (kubeconform)
        run: |
          for f in artifacts/ci/kustomize-local.yaml \
                   artifacts/ci/kustomize-staging.yaml \
                   artifacts/ci/kustomize-production.yaml; do
            echo "==> kubeconform $f"
            kubeconform \
              -kubernetes-version "${KUBECONFORM_K8S_VERSION}" \
              -summary \
              -strict \
              "$f"
          done

      - name: Pytest Kubernetes/Terraform static suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -v tests/k8s tests/terraform --tb=short
