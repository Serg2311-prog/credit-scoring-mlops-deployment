name: CI Python

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-quality:
    name: pytest / flake8 / black
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: ${{ github.workspace }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-api.txt
            requirements-nn.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-api.txt -r requirements-nn.txt

      - name: Import smoke
        run: |
          python -c "import src.api.main, src.schema, src.models.preprocessing, src.nn.model"

      - name: Generate CI synthetic artifacts
        run: |
          python scripts/ci/generate_synthetic_artifacts.py --output-dir models --force
          python scripts/ci/verify_artifacts.py --dir models --allow-synthetic

      - name: Black
        run: python -m black --check src tests scripts/ci airflow_home/dags

      - name: Flake8
        run: python -m flake8 src tests scripts/ci airflow_home/dags

      - name: Data schema / unit + integration (synthetic)
        run: |
          mkdir -p artifacts/ci
          python -m pytest -v \
            --junitxml=artifacts/ci/pytest-junit.xml \
            -m "not k8s and not e2e" \
            --tb=short

      - name: Real production artifact suite
        run: |
          # On GitHub-hosted runners production weights are absent → tests SKIP (exit 0).
          mkdir -p artifacts/ci
          python -m pytest -v -m real_artifacts --tb=line \
            --junitxml=artifacts/ci/pytest-real-artifacts.xml

      - name: Upload pytest reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-reports
          path: artifacts/ci/*.xml
          if-no-files-found: warn
