# Local Stage 7 Airflow demo stack.
# NOT a production deployment. No Celery/Redis/Postgres. No observability stack.
#
# Do not start automatically on low-RAM hosts without free memory headroom.
# Typical pull/build is heavy; prefer unit tests + CLI dry-run on Windows.
#
# Prepare demo input BEFORE starting (synthetic, no real credit PII):
#   .\.venv\Scripts\python.exe -m src.retraining.cli prepare-demo-input

services:
  airflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    image: credit-scoring-airflow:2.9.3
    mem_limit: 1536m
    cpus: 1.0
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__PARALLELISM: "1"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
      AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
      # Local demo convenience; production Airflow should keep DAGs paused by default.
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW__WEBSERVER__RBAC: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      PYTHONPATH: /opt/credit-scoring
      CREDIT_SCORING_ROOT: /opt/credit-scoring
      RETRAIN_DRY_RUN: "true"
      RETRAIN_TRIGGER_MODES: scheduled
      # Staff cron: Mondays 03:00 UTC (override via RETRAIN_SCHEDULE env).
      # For isolated E2E use docker-compose.airflow.e2e.yml (RETRAIN_SCHEDULE=None).
      RETRAIN_SCHEDULE: ${RETRAIN_SCHEDULE:-0 3 * * 1}
      RETRAIN_INPUT_PATH: /opt/credit-scoring/artifacts/retraining/demo_input/retrain_input.csv
      # Avoid retry storms during constrained local demos.
      RETRAIN_RETRIES: "0"
    volumes:
      # Named volume first for AIRFLOW_HOME metadata; bind mounts overlay dags/logs.
      - airflow-sqlite:/opt/airflow
      - ./airflow_home/dags:/opt/airflow/dags
      - ./airflow_home/logs:/opt/airflow/logs
      - ./src:/opt/credit-scoring/src
      - ./configs:/opt/credit-scoring/configs
      - ./params.yaml:/opt/credit-scoring/params.yaml:ro
      - ./models:/opt/credit-scoring/models
      - ./artifacts/retraining:/opt/credit-scoring/artifacts/retraining
      - ./data:/opt/credit-scoring/data
    # Entrypoint from Dockerfile handles ordered init (no fragile && / || true / & chains).
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 12
      start_period: 120s

volumes:
  airflow-sqlite:
