# Stage 5 local observability stack.
# Use with the API compose file (shared project network):
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d --build
#
# Pinned image tags (no latest). Sized for ~8 GB RAM laptops.

services:
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: credit-scoring-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=48h
      - --storage.tsdb.retention.size=1GB
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_started
      alertmanager:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:9090/-/healthy",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    cpus: 0.50
    mem_limit: 384m
    mem_reservation: 128m
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: credit-scoring-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    depends_on:
      alert-webhook:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:9093/-/healthy",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    cpus: 0.25
    mem_limit: 128m
    mem_reservation: 64m
    restart: unless-stopped

  alert-webhook:
    build:
      context: ./monitoring/alert-webhook
      dockerfile: Dockerfile
    image: credit-scoring-alert-webhook:stage5
    container_name: credit-scoring-alert-webhook
    ports:
      - "9095:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
    cpus: 0.10
    mem_limit: 64m
    mem_reservation: 32m
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    container_name: credit-scoring-loki
    user: "0:0"
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:3100/ready",
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 30s
    cpus: 0.50
    mem_limit: 384m
    mem_reservation: 128m
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.7.5
    container_name: credit-scoring-alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12345:12345"
    depends_on:
      loki:
        condition: service_started
      api:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:12345/-/ready",
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 25s
    cpus: 0.25
    mem_limit: 192m
    mem_reservation: 64m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    container_name: credit-scoring-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/api/health | grep -q 'ok\\|database'",
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 30s
    cpus: 0.50
    mem_limit: 256m
    mem_reservation: 128m
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    container_name: credit-scoring-cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8088:8080"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    cpus: 0.25
    mem_limit: 192m
    mem_reservation: 64m
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  alloy-data:
  grafana-data:
