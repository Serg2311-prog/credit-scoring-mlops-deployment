# Horizontal scaling for the credit-scoring API (CPU-based).
# Complements fixed replicas + rollingUpdate in patch-resources / patch-rolling-update.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: credit-scoring-api
  labels:
    app.kubernetes.io/name: credit-scoring-api
    app.kubernetes.io/part-of: credit-scoring-mlops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: credit-scoring-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
