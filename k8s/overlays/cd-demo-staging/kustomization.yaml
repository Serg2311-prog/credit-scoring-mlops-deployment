# Isolated kind/local CD demo for staging (does not touch credit-scoring ns).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: credit-scoring-cd-staging

resources:
  - ../staging

patches:
  - target:
      kind: Namespace
      name: credit-scoring-staging
    patch: |-
      - op: replace
        path: /metadata/name
        value: credit-scoring-cd-staging
  - path: patch-host.yaml
  - path: patch-replicas.yaml

images:
  - name: credit-scoring-api
    newName: credit-scoring-api
    newTag: cd-demo
  - name: credit-scoring-models
    newName: credit-scoring-models
    newTag: cd-demo
  - name: credit-scoring-frontend
    newName: credit-scoring-frontend
    newTag: cd-demo
