# Staging overlay — separate namespace; image tags/digests set at deploy time.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: credit-scoring-staging

resources:
  - ../../base
  # Secret: apply secret.example.yaml manually / sealed-secrets — not committed as live Secret.

patches:
  - target:
      kind: Namespace
      name: credit-scoring
    patch: |-
      - op: replace
        path: /metadata/name
        value: credit-scoring-staging
      - op: add
        path: /metadata/labels/app.kubernetes.io~1environment
        value: staging
  - path: patch-ingress-host.yaml
  - path: patch-resources.yaml
  - path: patch-rolling-update.yaml

images:
  - name: credit-scoring-api
    newName: credit-scoring-api
    newTag: staging
  - name: credit-scoring-models
    newName: credit-scoring-models
    newTag: staging
  - name: credit-scoring-frontend
    newName: credit-scoring-frontend
    newTag: staging

labels:
  - pairs:
      app.kubernetes.io/environment: staging
    includeSelectors: false
