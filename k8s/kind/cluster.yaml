# Minimal single-node kind cluster for local inference API (laptop-friendly).
# Extra port mappings support ingress-nginx on host :8080 / :8443.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: credit-scoring
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
