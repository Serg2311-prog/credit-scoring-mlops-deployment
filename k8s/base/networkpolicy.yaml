apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: credit-scoring
  labels:
    app.kubernetes.io/part-of: credit-scoring-mlops
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Frontend UI: Ingress controller (+ kubelet probes via kube-system).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend
  namespace: credit-scoring
  labels:
    app.kubernetes.io/name: credit-scoring-frontend
    app.kubernetes.io/part-of: credit-scoring-mlops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: credit-scoring-frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8080
---
# API: frontend reverse-proxy, Ingress direct paths, optional in-cluster Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api
  namespace: credit-scoring
  labels:
    app.kubernetes.io/name: credit-scoring-api
    app.kubernetes.io/part-of: credit-scoring-mlops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: credit-scoring-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: credit-scoring-frontend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        # Optional future in-cluster Prometheus (compose Prometheus is outside K8s).
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8000
