apiVersion: v1
kind: Service
metadata:
  name: credit-scoring-api
  namespace: credit-scoring
  labels:
    app.kubernetes.io/name: credit-scoring-api
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: credit-scoring-mlops
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: credit-scoring-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
