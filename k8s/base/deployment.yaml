apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-scoring-api
  namespace: credit-scoring
  labels:
    app.kubernetes.io/name: credit-scoring-api
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: credit-scoring-mlops
spec:
  replicas: 1
  # Laptop-friendly: avoid concurrent pods during rollout (maxSurge=0).
  # Trade-off: brief unavailability during update; not zero-downtime.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: credit-scoring-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: credit-scoring-api
        app.kubernetes.io/component: inference
        app.kubernetes.io/part-of: credit-scoring-mlops
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # Match Dockerfile appuser (uid 10001); emptyDir writable via fsGroup.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Models delivered via initContainer from trusted local image (kind load).
      # Do not use Windows hostPath — kind nodes are Linux Docker containers.
      initContainers:
        - name: copy-models
          image: credit-scoring-models:stage3a
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              cp /artifacts/credit_scoring_nn.onnx /models/credit_scoring_nn.onnx
              cp /artifacts/preprocessor.joblib /models/preprocessor.joblib
              ls -la /models
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: model-data
              mountPath: /models
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
      containers:
        - name: api
          image: credit-scoring-api:stage3a
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: credit-scoring-api-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: model-data
              mountPath: /app/models
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # Process up — no model check, no inference.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # Ready only when ONNX + preprocessor loaded (503 otherwise).
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 2"]
      volumes:
        - name: model-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
