apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: credit-scoring
  namespace: credit-scoring
  labels:
    app.kubernetes.io/name: credit-scoring
    app.kubernetes.io/part-of: credit-scoring-mlops
  annotations:
    # Compatible with ingress-nginx (kind local / cloud).
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Direct API paths (OpenAPI, health, metrics, predict).
          - path: /predict
            pathType: Prefix
            backend:
              service:
                name: credit-scoring-api
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: credit-scoring-api
                port:
                  number: 8000
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: credit-scoring-api
                port:
                  number: 8000
          - path: /model
            pathType: Prefix
            backend:
              service:
                name: credit-scoring-api
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: credit-scoring-api
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: credit-scoring-api
                port:
                  number: 8000
          # UI + /api/* reverse-proxy to backend.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: credit-scoring-frontend
                port:
                  number: 80
