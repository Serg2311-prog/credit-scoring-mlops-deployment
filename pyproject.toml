[project]
name = "credit-scoring-mlops-deployment"
version = "0.1.0"
description = "Industrial MLOps deployment for credit scoring"
readme = "README.md"
requires-python = ">=3.11"

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: ONNX/preprocessor contract tests (synthetic CI or real artifacts)",
    "real_artifacts: requires non-synthetic stage-1 production artifacts",
    "e2e: end-to-end checks against a running API process",
    "k8s: tests that require a live kind/Kubernetes cluster",
]
