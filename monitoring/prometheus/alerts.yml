groups:
  - name: credit-scoring-api
    rules:
      - alert: APIDown
        expr: up{job="credit-scoring-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Credit scoring API scrape target is down"
          description: "Prometheus cannot scrape credit-scoring-api for more than 1 minute."

      - alert: HighHTTP5xxRate
        expr: |
          (
            sum(rate(credit_scoring_http_requests_total{status_code=~"5.."}[5m]))
            /
            clamp_min(sum(rate(credit_scoring_http_requests_total[5m])), 0.001)
          ) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 5xx rate on credit-scoring API"
          description: "More than 5% of requests are 5xx over the last 5 minutes."

      - alert: HighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(credit_scoring_http_request_latency_seconds_bucket[5m]))
          ) > 1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High p95 HTTP latency"
          description: "API HTTP p95 latency is above 1s for 3 minutes."

      - alert: ModelNotReady
        expr: credit_scoring_model_ready == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ONNX model runtime is not ready"
          description: "credit_scoring_model_ready has been 0 for more than 2 minutes."

      - alert: APIMetricsAbsent
        expr: absent(up{job="credit-scoring-api"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API metrics job missing from Prometheus"
          description: "The credit-scoring-api scrape job is absent from Prometheus."
