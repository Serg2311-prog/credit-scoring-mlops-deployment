services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: credit-scoring-api:stage2
    container_name: credit-scoring-api
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      APP_ENV: docker
      MODEL_PATH: /app/models/credit_scoring_nn.onnx
      PREPROCESSOR_PATH: /app/models/preprocessor.joblib
      PREDICTION_THRESHOLD: "0.5"
      MAX_BATCH_SIZE: "256"
      ORT_INTRA_OP_THREADS: "2"
      LOG_LEVEL: INFO
    volumes:
      - ./models/credit_scoring_nn.onnx:/app/models/credit_scoring_nn.onnx:ro
      - ./models/preprocessor.joblib:/app/models/preprocessor.joblib:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    # Moderate limits for 8GB laptop; avoid too-low memory that causes OOM on import.
    cpus: 1.0
    mem_limit: 1536m
    mem_reservation: 512m
