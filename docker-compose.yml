# Inference API + frontend UI (Stage 3). Observability: docker-compose.observability.yml
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d --build

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: credit-scoring-api:stage2
    container_name: credit-scoring-api
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      APP_ENV: docker
      MODEL_PATH: /app/models/credit_scoring_nn.onnx
      PREPROCESSOR_PATH: /app/models/preprocessor.joblib
      PREDICTION_THRESHOLD: "0.5"
      MAX_BATCH_SIZE: "256"
      ORT_INTRA_OP_THREADS: "2"
      LOG_LEVEL: INFO
    volumes:
      - ./models/credit_scoring_nn.onnx:/app/models/credit_scoring_nn.onnx:ro
      - ./models/preprocessor.joblib:/app/models/preprocessor.joblib:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    # Moderate limits for 8GB laptop; avoid too-low memory that causes OOM on import.
    cpus: 1.0
    mem_limit: 1536m
    mem_reservation: 512m
    networks:
      - default

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: credit-scoring-frontend:stage3
    container_name: credit-scoring-frontend
    ports:
      - "8081:8080"
    environment:
      API_UPSTREAM: api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 128m
    networks:
      - default

networks:
  default:
    name: credit-scoring-net
